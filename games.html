<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Games - MaxGameStore</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .games-list {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 50px;
        }
        .game-card {
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 20px;
            width: 250px;
            text-align: center;
            transition: 0.3s;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        .game-card img {
            width: 100%;
            border-radius: 10px;
        }
        .play-now {
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MaxGameStore</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="login.html" class="login-btn">Login</a></li>
        </ul>
    </nav>
    
    <div class="games-list">
        <div class="game-card">
            <h2>⚔️ WORLD OF FIGHTS</h2>
            <p>Joc 2D multiplayer cu quest-uri și lupte</p>
            <a href="games/world-of-fights/index.html"><button class="play-now">Play Now</button></a>
        </div>
        <div class="game-card">
            <h2>🎮 Coming Soon</h2>
            <p>Mai multe jocuri în curând...</p>
            <button class="play-now" disabled>Coming Soon</button>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>
</body>
</html>
