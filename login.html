<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Login - MaxGameStore</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            text-align: center;
        }
        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
        }
        .auth-container button {
            background: #2ecc71;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        .switch-btn {
            background: #3498db;
        }
        .error {
            color: #e74c3c;
            margin: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">MaxGameStore</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="login.html" class="login-btn">Login</a></li>
        </ul>
    </nav>
    
    <div class="auth-container" id="loginPanel">
        <h2>🔐 LOGIN</h2>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="error" id="loginError"></div>
        <p>Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
    </div>
    
    <div class="auth-container" id="registerPanel" style="display:none">
        <h2>📝 CREATE ACCOUNT</h2>
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="password" id="regConfirm" placeholder="Confirm Password">
        <button onclick="register()">Create Account</button>
        <div class="error" id="regError"></div>
        <p>Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
    </div>
    
    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>
    
    <script>
        function showRegister() {
            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('registerPanel').style.display = 'block';
        }
        
        function showLogin() {
            document.getElementById('registerPanel').style.display = 'none';
            document.getElementById('loginPanel').style.display = 'block';
        }
        
        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            
            if (!username || !password) {
                document.getElementById('regError').innerText = 'Username and password required!';
                return;
            }
            
            if (password !== confirm) {
                document.getElementById('regError').innerText = 'Passwords do not match!';
                return;
            }
            
            // Get existing users
            let users = JSON.parse(localStorage.getItem('users') || '{}');
            
            if (users[username]) {
                document.getElementById('regError').innerText = 'Username already exists!';
                return;
            }
            
            users[username] = password;
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', username);
            
            window.location.href = 'index.html';
        }
        
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            let users = JSON.parse(localStorage.getItem('users') || '{}');
            
            if (users[username] && users[username] === password) {
                localStorage.setItem('currentUser', username);
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password!';
            }
        }
        
        // Verifică dacă e deja logat
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
