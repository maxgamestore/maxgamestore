<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Login - MaxGameStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            text-align: center;
        }
        h1 { color: #ffd700; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }
        button {
            width: 100%;
            background: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            font-weight: bold;
        }
        .error { color: #e74c3c; margin: 10px 0; }
        .switch a { color: #3498db; text-decoration: none; }
        .production { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="auth-container" id="loginPanel">
        <h1>🔐 MAXGAMESTORE</h1>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <div class="error" id="loginError"></div>
        <div class="switch">
            Nu ai cont? <a href="register.html">Creează cont</a>
        </div>
        <div class="production">MaxGameStore's production</div>
    </div>

    <script>
        // BACKEND_URL - înlocuiește cu adresa ta de la Tunnelmole
        const BACKEND_URL = 'https://sjtcoi-ip-86-120-129-102.tunnelmole.net';
        
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('currentUser', username);
                    localStorage.setItem('userRank', data.rank);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('loginError').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('loginError').innerText = 'Server offline. Încearcă mai târziu.';
            }
        }
    </script>
</body>
</html>
