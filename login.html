<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; text-align: center; padding: 50px; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
        button { background: #2ecc71; color: white; cursor: pointer; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>🔐 Login</h1>
    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="login()">LOGIN</button>
    <p><a href="register.html">Nu ai cont? Inregistreaza-te</a></p>
    <div id="message" class="error"></div>
    <div class="production">MaxGameStore's production</div>

    <script>
        const BACKEND_URL = 'https://trimmer-chrome-landfall.ngrok-free.dev';
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('currentUser', username);
                    localStorage.setItem('userRank', data.rank);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('message').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('message').innerText = 'Server offline. Încearcă mai târziu.';
            }
        }
    </script>
</body>
</html>
