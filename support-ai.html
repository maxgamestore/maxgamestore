<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support - MaxGameStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 750px;
            width: 95%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header .icon {
            font-size: 30px;
        }

        .header h1 {
            font-size: 20px;
            color: #ffd700;
        }

        .header .subtitle {
            font-size: 12px;
            color: #666;
        }

        .header .close {
            color: #666;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 0 10px;
        }

        .header .close:hover {
            color: #ff6b6b;
        }

        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            margin-left: 8px;
        }

        .status-badge.online {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status-badge.offline {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .status-badge.checking {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            border: 1px solid rgba(243, 156, 18, 0.3);
        }

        .chat-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            max-height: 420px;
            min-height: 250px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-box::-webkit-scrollbar {
            width: 4px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }

        .message {
            margin: 6px 0;
            padding: 8px 14px;
            border-radius: 10px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #ddd;
            align-self: flex-start;
        }

        .message.bot .code {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #ffd93d;
            display: inline-block;
            margin: 2px 0;
        }

        .message.user {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.2);
            color: #fff;
            align-self: flex-end;
            margin-left: auto;
        }

        .message .time {
            font-size: 9px;
            color: #666;
            margin-top: 4px;
        }

        .message .error-text {
            color: #ff6b6b;
        }

        .message .success-text {
            color: #2ecc71;
        }

        .input-area {
            display: flex;
            gap: 8px;
        }

        .input-area textarea {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 13px;
            resize: none;
            height: 42px;
            font-family: inherit;
            transition: 0.3s;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.08);
        }

        .input-area textarea::placeholder {
            color: #666;
        }

        .input-area button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(45deg, #ffd700, #f39c12);
            color: #1a1a2e;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            min-width: 70px;
        }

        .input-area button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .quick-actions button {
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }

        .quick-actions button:hover {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
        }

        .status {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 8px;
        }

        .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .status .dot.online { background: #2ecc71; }
        .status .dot.offline { background: #e74c3c; }
        .status .dot.checking { background: #f39c12; }

        .typing {
            color: #888;
            font-size: 12px;
            padding: 3px 0;
            display: none;
        }

        .typing.show {
            display: block;
        }

        .typing span {
            animation: blink 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 60%, 100% { opacity: 1; }
            30% { opacity: 0; }
        }

        .ai-avatar {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ffd700, #f39c12);
            color: #1a1a2e;
            text-align: center;
            line-height: 28px;
            font-size: 14px;
            margin-right: 6px;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .header h1 { font-size: 18px; }
            .input-area textarea { font-size: 12px; height: 36px; }
            .input-area button { font-size: 12px; padding: 8px 14px; min-width: 60px; }
            .message { font-size: 13px; }
            .chat-box { max-height: 300px; min-height: 180px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="icon">🤖</span>
                <div>
                    <h1>MaxGameStore AI</h1>
                    <span class="subtitle">Support Assistant</span>
                </div>
                <span id="aiStatus" class="status-badge checking">⏳</span>
            </div>
            <a href="index.html" class="close" title="Close">✕</a>
        </div>

        <!-- Chat Box -->
        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <span class="ai-avatar">AI</span> 👋 Hey! I'm MaxGameStore AI.<br>
                I can help you with:<br>
                • 🎮 <strong>World Of Fights</strong> (WoF)<br>
                • 🚀 <strong>Project Nexus</strong><br>
                • 🔧 <strong>Technical issues</strong><br>
                • 🏢 <strong>Company info</strong><br><br>
                <em>Ask me anything!</em>
                <div class="time">Just now</div>
            </div>
            <div id="typingIndicator" class="typing">
                <span>●</span><span>●</span><span>●</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button onclick="quickAction('launcher')">🚀 Launcher</button>
            <button onclick="quickAction('oracle')">🔴 Oracle JDK</button>
            <button onclick="quickAction('login')">🔐 Login</button>
            <button onclick="quickAction('games')">🎮 Games</button>
            <button onclick="quickAction('company')">🏢 Company</button>
            <button onclick="quickAction('update')">📦 Updates</button>
        </div>

        <!-- Input -->
        <div class="input-area">
            <textarea id="userInput" placeholder="Ask me anything..." rows="1"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>

        <!-- Status -->
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <script>
        // ================================================================
        // 🔧 CONFIG - Înlocuiește cu linkul tău ngrok
        // ================================================================
        const AI_API_URL = 'https://trimmer-chrome-landfall.ngrok-free.dev';

        // ================================================================
        // VARIABLES
        // ================================================================
        let isProcessing = false;

        // ================================================================
        // CHECK AI STATUS
        // ================================================================
        function checkAIStatus() {
            const badge = document.getElementById('aiStatus');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            badge.textContent = '⏳';
            badge.className = 'status-badge checking';
            dot.className = 'dot checking';
            text.textContent = 'Checking connection...';

            fetch(`${AI_API_URL}/api/ai/status`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    badge.textContent = '🟢 Online';
                    badge.className = 'status-badge online';
                    dot.className = 'dot online';
                    text.textContent = `AI ready • ${data.knowledge.games} games • ${data.knowledge.solutions} solutions`;
                    console.log('✅ AI Server online:', data);
                })
                .catch((err) => {
                    console.error('❌ AI Status error:', err);
                    badge.textContent = '🔴 Offline';
                    badge.className = 'status-badge offline';
                    dot.className = 'dot offline';
                    text.textContent = 'AI offline - make sure server is running';
                });
        }

        // ================================================================
        // ADD MESSAGE
        // ================================================================
        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const msg = document.createElement('div');
            msg.className = `message ${sender}`;
            
            // Procesează textul pentru formatare
            let formatted = text
                .replace(/\n/g, '<br>')
                .replace(/`([^`]+)`/g, '<span class="code">$1</span>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            if (sender === 'bot') {
                formatted = `<span class="ai-avatar">AI</span> ${formatted}`;
            }
            
            msg.innerHTML = formatted;
            
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = new Date().toLocaleTimeString();
            msg.appendChild(time);
            
            // Inserează înaintea indicatorului de typing
            const typingIndicator = document.getElementById('typingIndicator');
            chatBox.insertBefore(msg, typingIndicator);
            
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ================================================================
        // QUICK ACTIONS
        // ================================================================
        function quickAction(type) {
            const input = document.getElementById('userInput');
            const msgs = {
                'launcher': 'Launcher won\'t open when I double-click it',
                'oracle': 'I have Oracle JDK issues, the launcher doesn\'t open',
                'login': 'I can\'t log in to my account',
                'games': 'What games does MaxGameStore have?',
                'company': 'Tell me about MaxGameStore Corporation',
                'update': 'What are the latest updates for World Of Fights?'
            };
            input.value = msgs[type] || '';
            sendMessage();
        }

        // ================================================================
        // SEND MESSAGE
        // ================================================================
        function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg || isProcessing) return;

            input.value = '';
            addMessage(msg, 'user');
            isProcessing = true;
            document.getElementById('sendBtn').disabled = true;

            // Arată typing indicator
            const typing = document.getElementById('typingIndicator');
            typing.classList.add('show');
            document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

            const startTime = Date.now();

            fetch(`${AI_API_URL}/api/ai/analyze`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: msg,
                    userName: localStorage.getItem('currentUser') || 'Guest',
                    userEmail: localStorage.getItem('userEmail') || ''
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(data => {
                typing.classList.remove('show');
                
                // Asigură timp minim de răspuns pentru UX
                const elapsed = Date.now() - startTime;
                const minDelay = 300;
                const delay = Math.max(0, minDelay - elapsed);
                
                setTimeout(() => {
                    if (data.success) {
                        let response = data.solution;
                        
                        // Adaugă info Java dacă e disponibil
                        if (data.javaInfo) {
                            const javaType = data.javaInfo.isOpenJDK ? 'OpenJDK ✅' : 'Oracle JDK ❌';
                            response += `\n\n🔍 **Java detected:** ${javaType} (v${data.javaInfo.version})`;
                            if (data.javaInfo.isOracle) {
                                response += `\n⚠️ **Warning:** Oracle JDK may cause issues!`;
                            }
                        }
                        
                        // Adaugă contact
                        if (data.contact) {
                            response += `\n\n📧 **Need more help?** Contact: ${data.contact}`;
                        }
                        
                        addMessage(response, 'bot');
                    } else {
                        addMessage(`❌ **Error:** ${data.error || 'Something went wrong'}`, 'bot');
                    }
                    isProcessing = false;
                    document.getElementById('sendBtn').disabled = false;
                }, delay);
            })
            .catch((err) => {
                console.error('❌ Send error:', err);
                typing.classList.remove('show');
                
                // Afișează mesaj de eroare detaliat
                let errorMsg = '❌ **Connection Error**\n\n';
                if (err.message.includes('Failed to fetch')) {
                    errorMsg += 'Could not reach the AI server.\n\n';
                    errorMsg += '**Possible reasons:**\n';
                    errorMsg += '• Server is not running\n';
                    errorMsg += '• Ngrok is not active\n';
                    errorMsg += '• Wrong URL in configuration\n\n';
                    errorMsg += `**Current URL:** ${AI_API_URL}`;
                } else {
                    errorMsg += err.message;
                }
                addMessage(errorMsg, 'bot');
                isProcessing = false;
                document.getElementById('sendBtn').disabled = false;
            });
        }

        // ================================================================
        // KEYBOARD SHORTCUTS
        // ================================================================
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!document.getElementById('sendBtn').disabled) {
                    sendMessage();
                }
            }
        });

        // Auto-resize textarea
        document.getElementById('userInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Focus input la încărcare
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('userInput').focus();
        });

        // ================================================================
        // INIT
        // ================================================================
        window.onload = function() {
            checkAIStatus();
            setInterval(checkAIStatus, 30000);
        };
    </script>
</body>
</html>
