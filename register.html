<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - MaxGameStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        
        h1 {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border: 2px solid #ffd700;
            background: #444;
        }
        
        button {
            width: 100%;
            background: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #27ae60;
            transform: scale(1.02);
        }
        
        .error {
            color: #e74c3c;
            margin: 15px 0;
            font-size: 14px;
            min-height: 40px;
        }
        
        .success {
            color: #2ecc71;
        }
        
        .link {
            color: #3498db;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        p {
            margin-top: 20px;
            color: #aaa;
        }
        
        .optional {
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 CREATE ACCOUNT</h1>
        <input type="text" id="username" placeholder="Username *">
        <input type="password" id="password" placeholder="Password *">
        <input type="email" id="email" placeholder="Email (optional)">
        <button onclick="register()">CREATE ACCOUNT</button>
        <div id="message" class="error"></div>
        <p>Already have an account? <a href="login.html" class="link">Login here</a></p>
        <div class="optional">* Required fields</div>
    </div>

    <script>
        const BACKEND_URL = 'https://trimmer-chrome-landfall.ngrok-free.dev';
        
        async function register() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();
            
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.innerText = '❌ Username and password are required!';
                messageDiv.style.color = '#e74c3c';
                return;
            }
            
            messageDiv.innerText = '⏳ Creating account...';
            messageDiv.style.color = '#3498db';
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password, email })
                });
                
                const data = await response.json();
                console.log('Register response:', data);
                
                if (data.success) {
                    messageDiv.innerText = '✅ Account created! Redirecting to login...';
                    messageDiv.style.color = '#2ecc71';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    messageDiv.innerText = '❌ ' + (data.error || 'Registration failed');
                    messageDiv.style.color = '#e74c3c';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                messageDiv.innerText = '❌ Connection error: ' + error.message;
                messageDiv.style.color = '#e74c3c';
            }
        }
        
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
