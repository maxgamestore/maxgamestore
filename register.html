<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Register - MaxGameStore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .auth-container {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            text-align: center;
        }
        h1 { color: #ffd700; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }
        button {
            width: 100%;
            background: #2ecc71;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            font-weight: bold;
        }
        .error { color: #e74c3c; margin: 10px 0; }
        .switch a { color: #3498db; text-decoration: none; }
        .production { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>📝 CREATE ACCOUNT</h1>
        <input type="text" id="regUsername" placeholder="Username">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="password" id="regConfirm" placeholder="Confirm Password">
        <button onclick="register()">CREATE ACCOUNT</button>
        <div class="error" id="regError"></div>
        <div class="switch">
            Ai deja cont? <a href="login.html">Login</a>
        </div>
        <div class="production">MaxGameStore's production</div>
    </div>

    <script>
        const BACKEND_URL = 'https://trimmer-chrome-landfall.ngrok-free.dev';
        
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            
            if (!username || !password) {
                document.getElementById('regError').innerText = 'Completează toate câmpurile!';
                return;
            }
            if (password !== confirm) {
                document.getElementById('regError').innerText = 'Parolele nu coincid!';
                return;
            }
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert('Cont creat! Te poți loga.');
                    window.location.href = 'login.html';
                } else {
                    document.getElementById('regError').innerText = data.error;
                }
            } catch (err) {
                document.getElementById('regError').innerText = 'Server offline. Încearcă mai târziu.';
            }
        }
    </script>
</body>
</html>
