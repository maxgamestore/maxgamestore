<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MaxGameStore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
        }

        /* Navbar - fără logo în stânga */
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px 50px;
            background: rgba(0,0,0,0.3);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #ffd700;
        }

        /* User info în stânga sus */
        .user-info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
        }

        /* Hero section - centrat */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .production-badge {
            font-size: 14px;
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 64px;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .description {
            font-size: 18px;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .play-btn {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            text-decoration: none;
            margin-top: 40px;
            transition: 0.3s;
        }

        .play-btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: rgba(0,0,0,0.3);
            margin-top: 100px;
            font-size: 12px;
            color: #666;
        }

        /* Rank culori */
        .rank-owner { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        .rank-admin { color: #2ecc71; text-shadow: 0 0 5px #2ecc71; }
        .rank-developer { color: #e74c3c; text-shadow: 0 0 5px #e74c3c; }
        .rank-tester { color: #3498db; text-shadow: 0 0 5px #3498db; }
        .rank-user { color: #bdc3c7; }

        .logout-btn {
            background: #e74c3c;
            border-radius: 20px;
            padding: 5px 15px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div id="userInfo" class="user-info"></div>

    <div class="navbar">
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="support.html">Support</a>
            <a href="#" id="logoutBtn" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="hero">
        <div class="production-badge">MaxGameStore productions</div>
        <h1>MAXGAMESTORE</h1>
        <div class="description">
            Welcome to the official MaxGameStore platform.<br>
            Discover and play World Of Fights, a 2D multiplayer game.
        </div>
        <a href="games.html" class="play-btn">🎮 PLAY NOW</a>
    </div>

    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>

    <script>
        const currentUser = localStorage.getItem('currentUser');
        const userRank = localStorage.getItem('userRank') || 'user';
        
        if (!currentUser) {
            window.location.href = 'login.html';
        }
        
        let rankClass = '';
        let rankText = '';
        
        switch(userRank) {
            case 'owner': rankClass = 'rank-owner'; rankText = '👑 OWNER'; break;
            case 'admin': rankClass = 'rank-admin'; rankText = '⚙️ ADMIN'; break;
            case 'developer': rankClass = 'rank-developer'; rankText = '💻 DEVELOPER'; break;
            case 'tester': rankClass = 'rank-tester'; rankText = '🧪 TESTER'; break;
            default: rankClass = 'rank-user'; rankText = '🎮 PLAYER';
        }
        
        document.getElementById('userInfo').innerHTML = `<span class="${rankClass}">${currentUser} [${rankText}]</span>`;
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
