<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MaxGameStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        }
    </script>
    
    <nav>
        <div class="logo">MaxGameStore</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="#" id="logoutBtn" class="logout-btn">Logout</a></li>
        </ul>
    </nav>
    
    <span id="userInfo" class="user-info"></span>
    
    <div class="hero">
        <div class="production-badge">MaxGameStore's production</div>
        <h1>WORLD OF FIGHTS</h1>
        <p>Un joc 2D multiplayer creat de MaxGameStore</p>
        <a href="games.html" class="play-btn">Play Now</a>
    </div>
    
    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>
    
    <script>
        document.getElementById('userInfo').innerHTML = '👤 ' + localStorage.getItem('currentUser');
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
