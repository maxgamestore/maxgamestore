<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MaxGameStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        }
    </script>
    
    <nav>
        <div class="logo">MaxGameStore</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="#" id="logoutBtn" class="logout-btn">Logout</a></li>
        </ul>
    </nav>
    
    <div id="userInfo" class="user-info"></div>
    
    <div class="hero">
        <div class="production-badge">MaxGameStore's production</div>
        <h1>WORLD OF FIGHTS</h1>
        <p>Un joc 2D multiplayer creat de MaxGameStore</p>
        <a href="games.html" class="play-btn">Play Now</a>
    </div>
    
    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>
    
    <script>
        const user = localStorage.getItem('currentUser');
        const userRank = localStorage.getItem('userRank') || 'user';
        
        let rankDisplay = '';
        switch(userRank) {
            case 'owner': rankDisplay = '👑 OWNER'; break;
            case 'admin': rankDisplay = '⚙️ ADMIN'; break;
            case 'tester': rankDisplay = '🧪 TESTER'; break;
            case 'developer': rankDisplay = '💻 DEVELOPER'; break;
            default: rankDisplay = '🎮 PLAYER';
        }
        
        document.getElementById('userInfo').innerHTML = `👤 ${user} [${rankDisplay}]`;
        
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
