<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>MaxGameStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">MaxGameStore</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="support.html">Support</a></li>
            <li><a href="#" id="logoutBtn" class="logout-btn">Logout</a></li>
        </ul>
    </nav>
    
    <div class="hero">
        <div class="production-badge">MaxGameStore's production</div>
        <h1>WORLD OF FIGHTS</h1>
        <p>Un joc 2D multiplayer creat de MaxGameStore</p>
        <a href="games.html" class="play-btn">Play Now</a>
    </div>
    
    <footer>
        <p>&copy; 2025 MaxGameStore. All rights reserved.</p>
    </footer>
    
    <script src="js/main.js"></script>
    <script>
        // Verifică dacă utilizatorul este logat
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            window.location.href = 'login.html';
        }
        
        // Afișează numele utilizatorului în colțul stânga sus
        const usernameSpan = document.createElement('span');
        usernameSpan.className = 'user-info';
        usernameSpan.innerHTML = '👤 ' + currentUser;
        document.querySelector('.logo').after(usernameSpan);
        
        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
